<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoGPT Quick Access</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/nav-rail.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/input-dock.css">
  <link rel="stylesheet" href="css/history-drawer.css">
  <link rel="stylesheet" href="css/views.css">
  <style>
    body {
      width: 420px;
      height: 580px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .popup-top-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--brand-light);
      border-bottom: 1px solid rgba(79, 70, 229, 0.15);
      font-size: 11.5px;
      color: var(--brand-primary);
      font-weight: 600;
      flex-shrink: 0;
    }
    .btn-expand-sidepanel {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: var(--brand-primary);
      color: white;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
    }
    .btn-expand-sidepanel:hover {
      background: var(--brand-primary-hover);
    }
    .app-container {
      flex: 1;
      height: calc(580px - 33px) !important;
    }
    .chat-content-area {
      padding: 10px 12px 120px 12px !important;
    }
    .welcome-section {
      gap: 10px !important;
    }
    .prompt-suggestions-list {
      gap: 6px !important;
    }
    .prompt-suggestion-pill {
      padding: 7px 10px !important;
      font-size: 11.5px !important;
    }
  </style>
</head>
<body>
  <div class="popup-top-banner">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 14px;">✨</span>
      <span>EchoGPT Quick Copilot</span>
    </div>
    <button class="btn-expand-sidepanel" id="btnExpandSidePanel">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
      <span>Side Panel</span>
    </button>
  </div>

  <div class="app-container" style="height: calc(100vh - 33px);">
    <main class="workspace-pane" id="workspacePane">
      <!-- Chat View -->
      <section class="chat-workspace view-container active" id="viewChat">
        <header class="chat-header">
          <div class="chat-title-group">
            <h1 class="chat-title" style="font-size: 17px;">Chat</h1>
          </div>
          <div class="chat-header-actions">
            <button class="btn-new-chat" id="btnNewChat">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>New</span>
            </button>
            <button class="btn-header-icon" id="btnHistoryDrawer" title="History">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </button>
          </div>
        </header>

        <div class="chat-content-area" id="chatScrollArea">
          <div class="welcome-section" id="welcomeSection">
            <h2 class="welcome-headline" style="font-size: 18px;">How can I help you?</h2>

            <div class="action-grid">
              <div class="action-card card-write" data-action="write">
                <div class="action-icon-wrapper">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                  </svg>
                </div>
                <span class="action-card-text">Write</span>
              </div>

              <div class="action-card card-translate" data-action="translate">
                <div class="action-icon-wrapper">
                  <span style="font-size: 12px; font-weight: 700;">A⇄文</span>
                </div>
                <span class="action-card-text">Translate</span>
              </div>

              <div class="action-card card-read" data-action="read-page">
                <div class="action-icon-wrapper">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                  </svg>
                </div>
                <span class="action-card-text">Read page</span>
              </div>

              <div class="action-card card-compare" data-action="compare">
                <div class="action-icon-wrapper">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <rect x="3" y="3" width="7" height="18" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="18" rx="1"></rect>
                  </svg>
                </div>
                <span class="action-card-text">Compare</span>
              </div>
            </div>

            <div class="prompt-suggestions-list">
              <div class="prompt-suggestion-pill" data-prompt="Summarize the active page briefly">
                Summarize the active page briefly
              </div>
              <div class="prompt-suggestion-pill" data-prompt="Explain quantum computing in simple terms">
                Explain quantum computing in simple terms
              </div>
              <div class="prompt-suggestion-pill" data-prompt="Tell me an interesting fun fact">
                Tell me an interesting fun fact
              </div>
            </div>
          </div>

          <div class="message-list" id="messageList" style="display: none;"></div>
        </div>

        <!-- Docked Input -->
        <div class="input-dock-container" id="inputDockContainer">
          <div class="dock-top-bar">
            <button class="model-pill-btn" id="btnModelPicker">
              <span class="indicator-dot"></span>
              <span id="activeModelName">EchoGPT</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="dock-tools-row">
              <button class="btn-dock-tool" id="btnToolEnhance" title="Enhance prompt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="dock-context-chips" id="dockContextChips" style="display: none;"></div>

          <div class="input-box-wrapper">
            <textarea class="chat-textarea" id="chatTextarea" rows="1" placeholder="Ask a question..."></textarea>
            <div class="input-inner-bottom">
              <button class="btn-web-search-toggle" id="btnWebSearchToggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                </svg>
                <span>Search</span>
              </button>
              <button class="btn-send-message" id="btnSendMessage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- History Drawer in Popup -->
      <div class="history-drawer" id="historyDrawer">
        <div class="history-drawer-header">
          <span class="history-title">History</span>
          <button class="btn-header-icon" id="btnCloseHistoryDrawer">✕</button>
        </div>
        <div class="history-list" id="historyItemsContainer"></div>
      </div>

      <!-- Model Modal in Popup -->
      <div class="model-modal-overlay" id="modelModalOverlay">
        <div class="model-modal-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700;">Select Model</span>
            <button class="btn-header-icon" id="btnCloseModelModal">✕</button>
          </div>
          <div class="model-options-list" id="modelOptionsList"></div>
        </div>
      </div>
    </main>

    <!-- Rail Navigation (Compact) -->
    <nav class="nav-rail" id="navRail" style="width: 52px; padding: 6px 0;">
      <div class="rail-group top">
        <button class="rail-item active" data-view="viewChat" data-tooltip="Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span class="rail-label">Chat</span>
        </button>
      </div>
      <div class="rail-group bottom">
        <button class="rail-avatar-btn" style="width: 28px; height: 28px; font-size: 11px;">R</button>
      </div>
    </nav>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
