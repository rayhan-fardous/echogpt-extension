<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoGPT - Chrome Extension Preview & Showcase</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .preview-navbar {
      height: 48px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
    }
    .preview-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #818cf8;
    }
    .preview-tabs {
      display: flex;
      gap: 8px;
    }
    .preview-btn {
      padding: 5px 12px;
      border-radius: 6px;
      background: #334155;
      color: #cbd5e1;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preview-btn.active, .preview-btn:hover {
      background: #6366f1;
      color: white;
    }
    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      padding: 20px;
      position: relative;
    }
    .frame-wrapper {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .frame-wrapper.sidepanel-mode {
      width: 440px;
      height: 92vh;
    }
    .frame-wrapper.popup-mode {
      width: 420px;
      height: 580px;
    }
    .browser-mock-header {
      height: 36px;
      background: #2b2b2b;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: #e2e8f0;
      font-size: 12px;
      user-select: none;
    }
    .browser-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.red { background: #ef4444; }
    .dot.yellow { background: #f59e0b; }
    .dot.green { background: #10b981; }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <div class="preview-navbar">
    <div class="preview-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
      </svg>
      <span>EchoGPT Chrome Extension Environment</span>
    </div>
    <div class="preview-tabs">
      <button class="preview-btn active" id="btnSidepanelView">Side Panel Mode (440px)</button>
      <button class="preview-btn" id="btnPopupView">Popup Mode (420x580)</button>
    </div>
  </div>

  <div class="preview-container">
    <div class="frame-wrapper sidepanel-mode" id="frameWrapper">
      <div class="browser-mock-header">
        <div class="browser-dots">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <span style="margin-left: 8px; font-weight: 600;" id="frameTitle">EchoGPT - Multi-AI Chat Sidebar</span>
      </div>
      <iframe src="sidepanel.html" id="previewIframe"></iframe>
    </div>
  </div>

  <script>
    const btnSidepanel = document.getElementById("btnSidepanelView");
    const btnPopup = document.getElementById("btnPopupView");
    const frameWrapper = document.getElementById("frameWrapper");
    const previewIframe = document.getElementById("previewIframe");
    const frameTitle = document.getElementById("frameTitle");

    btnSidepanel.addEventListener("click", () => {
      btnSidepanel.classList.add("active");
      btnPopup.classList.remove("active");
      frameWrapper.className = "frame-wrapper sidepanel-mode";
      previewIframe.src = "sidepanel.html";
      frameTitle.textContent = "EchoGPT - Multi-AI Chat Sidebar";
    });

    btnPopup.addEventListener("click", () => {
      btnPopup.classList.add("active");
      btnSidepanel.classList.remove("active");
      frameWrapper.className = "frame-wrapper popup-mode";
      previewIframe.src = "popup.html";
      frameTitle.textContent = "EchoGPT Quick Access Popup";
    });
  </script>
</body>
</html>
